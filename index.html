<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>E-Bazar</title>
<meta name="description" content="E-Bazar — халяльные узбекские продукты в Турции. Доставка, оплата наличными, заказ через Telegram.">
<meta name="theme-color" content="#f3f3f5">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/logo-mark.png">
<meta property="og:title" content="e-bazar">
<meta property="og:description" content="Doim siz uchun xizmatda. Sifatli va tezkor albatta.">
<meta property="og:image" content="assets/logo.png">
<link rel="preload" as="image" href="assets/logo-cart.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f3f3f5; --surface:#ffffff; --surface-2:#e9e9ed; --text:#1c1c1f; --muted:#5e5f67;
    --line:rgba(28,28,31,.08);
    --accent:#c81e25; --accent-press:#a8181e; --accent-soft:#fce8e8;
    --ink:#1f1f22; --ink-text:#f3f3f5;
    --danger:#c62828; --danger-soft:#fbe4e4;
    --shadow-sm:0 1px 2px rgba(22,22,30,.06);
    --shadow-md:0 14px 34px -14px rgba(22,22,30,.32);
    --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
    --ease:cubic-bezier(.2,.8,.2,1);
    --z-bar:30; --z-nav:35; --z-header:40; --z-modal:50; --z-toast:60;
  }
  [data-theme="dark"]{
    --bg:#111113; --surface:#1a1a1e; --surface-2:#25252a; --text:#f0f0f2; --muted:#94949c;
    --line:rgba(255,255,255,.07);
    --accent:#ec3a40; --accent-press:#d52d33; --accent-soft:#2a1315;
    --ink:#f0f0f2; --ink-text:#111113;
    --danger:#ef5350; --danger-soft:#3a1d1d;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 14px 34px -14px rgba(0,0,0,.7);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{background:var(--bg);color:var(--text);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;transition:background .25s}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font-family:inherit;font-size:16px;font-weight:500;width:100%;padding:13px 14px;
    border:1.5px solid transparent;border-radius:var(--r-md);background:var(--surface-2);color:var(--text);
    outline:none;transition:border-color .2s,background .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
  textarea{resize:none}
  svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .num{font-variant-numeric:tabular-nums}
  .container{max-width:560px;margin:0 auto;padding:0 16px 180px}
  body.no-nav .container{padding-bottom:40px}

  /* Header */
  .header{position:sticky;top:0;z-index:var(--z-header);
    background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px)}
  .header-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:8px}
  .logo{display:flex;align-items:center;gap:9px;flex:1;cursor:pointer;user-select:none;
    font-size:18px;font-weight:800;letter-spacing:-.03em}
  .brand-mark{display:flex;align-items:flex-end;height:30px;flex-shrink:0}
  .brand-mark img{height:100%;display:block}
  .bm-lines{transform-origin:100% 50%;animation:linesIdle 6s var(--ease) infinite}
  .bm-cart{transform-origin:35% 90%;animation:cartIdle 6s var(--ease) infinite}
  @keyframes cartIdle{0%,78%,100%{transform:none}82%{transform:translateX(3px) rotate(-6deg)}86%{transform:translateX(-1px) rotate(2deg)}90%{transform:none}}
  @keyframes linesIdle{0%,78%,100%{transform:none;opacity:1}82%{transform:scaleX(1.6);opacity:.55}90%{transform:none;opacity:1}}
  .logo.bump .bm-cart{animation:cartBump .55s var(--ease)}
  .logo.bump .bm-lines{animation:linesBump .55s var(--ease)}
  @keyframes cartBump{0%{transform:none}30%{transform:translateX(4px) rotate(-9deg)}60%{transform:translateX(-1px) rotate(3deg)}100%{transform:none}}
  @keyframes linesBump{0%{transform:none}30%{transform:scaleX(1.9);opacity:.5}100%{transform:none;opacity:1}}
  .brand-word{font-size:21px;font-weight:800;font-style:italic;letter-spacing:-.04em;color:var(--text)}
  .brand-word i{color:var(--accent)}

  /* Splash */
  .splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .4s ease,transform .4s ease}
  .splash.hide{opacity:0;transform:scale(1.04);pointer-events:none}
  .splash-in{width:min(72vw,300px);display:flex;flex-direction:column;align-items:center}
  .sp-mark{display:flex;align-items:flex-end;width:78%;margin-bottom:6%}
  .sp-lines{width:29.6%;opacity:0;transform-origin:100% 50%}
  .sp-cart{width:70.4%;opacity:0}
  .sp-word{width:100%;opacity:0}
  .sp-slogan{width:100%;opacity:0;margin-top:3%}
  .splash.play .sp-cart{animation:spCart .8s cubic-bezier(.3,1.35,.5,1) forwards}
  .splash.play .sp-lines{animation:spLines .7s .3s var(--ease) forwards}
  .splash.play .sp-word{animation:spUp .5s .75s var(--ease) forwards}
  .splash.play .sp-slogan{animation:spUp .5s .95s var(--ease) forwards}
  @keyframes spCart{0%{opacity:0;transform:translateX(-120%) rotate(-8deg)}55%{opacity:1;transform:translateX(6%) rotate(4deg)}80%{transform:translateX(-2%) rotate(-1deg)}100%{opacity:1;transform:none}}
  @keyframes spLines{0%{opacity:0;transform:scaleX(0)}50%{opacity:1;transform:scaleX(1.5)}100%{opacity:1;transform:none}}
  @keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);
    display:grid;place-items:center;transition:transform .15s var(--ease)}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn svg.i{width:19px;height:19px}
  .lang-switch{display:flex;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:12px;padding:3px;gap:2px}
  .lang-switch button{padding:6px 8px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);
    border-radius:9px;transition:background .2s,color .2s}
  .lang-switch button.active{background:var(--ink);color:var(--ink-text)}

  /* Pages */
  .page{display:none}
  .page.active{display:block;animation:pageIn .32s var(--ease)}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{display:flex;align-items:center;gap:10px;margin:14px 0 14px}
  .page-head h2{font-size:24px;font-weight:800;letter-spacing:-.035em;flex:1}
  .back-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center}
  .link-btn{font-size:13px;font-weight:700;color:var(--muted);padding:6px 4px}
  .link-btn:active{opacity:.6}

  /* Hero */
  .hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px 18px 18px;margin:4px 0 16px;color:#f3f3f5;
    background:
      radial-gradient(110% 80% at 108% -12%,rgba(216,35,42,.62) 0%,transparent 55%),
      radial-gradient(70% 60% at -10% 110%,#0a0a0c 0%,transparent 60%),
      linear-gradient(165deg,#2b2b30 0%,#18181b 100%);
    box-shadow:0 18px 40px -22px rgba(10,10,14,.75)}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:14px 14px;
    mask-image:linear-gradient(200deg,#000 10%,transparent 70%);-webkit-mask-image:linear-gradient(200deg,#000 10%,transparent 70%)}
  .hero > *{position:relative;z-index:1}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:#f4b3b5;margin-bottom:8px}
  .hero-eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff5a60;box-shadow:0 0 0 3px rgba(255,90,96,.22)}
  .hero-title{font-size:23px;line-height:1.15;font-weight:800;letter-spacing:-.035em;max-width:17ch;text-wrap:balance;margin-bottom:14px}
  .hero-list{display:grid;gap:7px;font-size:13.5px;font-weight:600;color:#e4e4e9}
  .hero-list div{display:flex;align-items:center;gap:9px}
  .hero-list .tick{width:20px;height:20px;border-radius:7px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex-shrink:0}
  .hero-list .tick svg.i{width:13px;height:13px;stroke-width:2.6;color:#ff8a8e}
  .hero-contacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .hero-contacts a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 10px;border-radius:12px;
    font-size:12.5px;font-weight:700;color:#fff;text-decoration:none;
    background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:background .2s,transform .15s}
  .hero-contacts a:active{transform:scale(.96);background:rgba(255,255,255,.2)}
  .hero-contacts svg.i{width:16px;height:16px}

  /* Search + chips */
  .search-box{position:relative;margin:0 0 12px}
  .search-box .s-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex;z-index:1}
  .search-box input{padding-left:44px;padding-right:44px;background:var(--surface);box-shadow:var(--shadow-sm)}
  .search-box input::-webkit-search-cancel-button{display:none}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;
    display:none;place-items:center;color:var(--muted)}
  .search-clear.show{display:grid}
  .chips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 15px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-sm);
    font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s,transform .15s}
  .chip:active{transform:scale(.95)}
  .chip.active{background:var(--ink);color:var(--ink-text)}
  .result-meta{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 2px 0}

  /* Product grid */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
  .card{background:var(--surface);border-radius:var(--r-lg);padding:6px 6px 12px;display:flex;flex-direction:column;
    box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
  .card:active{transform:scale(.98)}
  @media (hover:hover){.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}}
  .media{position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:var(--surface-2)}
  .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
  @media (hover:hover){.card:hover .media img{transform:scale(1.04)}}
  .media .emoji{width:100%;height:100%;display:grid;place-items:center;font-size:54px;color:var(--muted)}
  .media .emoji svg.i{width:40px;height:40px;stroke-width:1.5;opacity:.5}
  .card.is-out .media img,.card.is-out .media .emoji{filter:grayscale(1);opacity:.55}
  .fav{position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--muted);transition:transform .2s var(--ease),color .2s}
  .fav svg.i{width:17px;height:17px}
  .fav:active{transform:scale(.85)}
  .fav.on{color:var(--danger)}
  .fav.on svg.i{fill:currentColor}
  .tag-out{position:absolute;left:7px;top:7px;padding:4px 8px;border-radius:8px;background:var(--ink);color:var(--ink-text);
    font-size:10.5px;font-weight:800}
  .buy{position:absolute;right:7px;bottom:7px;left:7px;display:flex;justify-content:flex-end;pointer-events:none}
  .buy > *{pointer-events:auto}
  .fab{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;
    box-shadow:0 8px 16px -8px var(--accent);transition:transform .15s var(--ease),background .2s}
  .fab:active{transform:scale(.88);background:var(--accent-press)}
  .fab svg.i{stroke-width:2.4}
  .info{padding:10px 6px 0;display:flex;flex-direction:column;gap:3px}
  .price{font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .price small{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
  .name{font-size:13px;font-weight:600;line-height:1.3;color:var(--text);opacity:.88;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}

  /* Stepper */
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--accent-soft);border-radius:var(--r-md);padding:4px}
  .stepper button{width:38px;height:36px;border-radius:11px;background:var(--surface);color:var(--accent);display:grid;place-items:center;
    box-shadow:var(--shadow-sm);transition:transform .12s}
  .stepper button:active{transform:scale(.88)}
  .stepper button svg.i{width:17px;height:17px;stroke-width:2.4}
  .stepper span{min-width:28px;text-align:center;font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .stepper.mini{width:100%;background:var(--accent);padding:3px;border-radius:12px;box-shadow:0 8px 16px -8px var(--accent)}
  .stepper.mini button{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
  .stepper.mini span{color:#fff}

  /* Buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:var(--r-md);
    font-size:15px;font-weight:800;letter-spacing:-.01em;text-align:center;transition:transform .15s var(--ease),background .2s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .btn svg.i{width:19px;height:19px}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 12px 24px -14px var(--accent)}
  .btn-primary:active{background:var(--accent-press)}
  .btn-ink{background:var(--ink);color:var(--ink-text)}
  .btn-soft{background:var(--accent-soft);color:var(--accent)}
  .btn-ghost{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
  .btn-danger-soft{background:var(--danger-soft);color:var(--danger)}
  .btn-sm{width:auto;padding:8px 12px;font-size:13px;border-radius:11px}
  .btn-sm svg.i{width:16px;height:16px}

  /* Cart bar + bottom nav */
  .cart-bar{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:var(--z-bar);
    max-width:560px;margin:0 auto;padding:0 16px;animation:barIn .3s var(--ease)}
  @keyframes barIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .cart-bar-inner{display:flex;align-items:center;gap:12px;width:100%;background:var(--ink);color:var(--ink-text);
    border-radius:18px;padding:10px 10px 10px 12px;font-size:14px;font-weight:700;box-shadow:var(--shadow-md);text-align:left}
  .cart-bar-inner:active{transform:scale(.99)}
  .cart-bar .bag{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .cart-bar .grow{flex:1;display:flex;flex-direction:column;line-height:1.2}
  .cart-bar .grow small{font-size:11.5px;opacity:.6;font-weight:600}
  .cart-bar .go{display:flex;align-items:center;gap:4px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--ink-text) 12%,transparent);font-weight:800}
  .cart-bar .go svg.i{width:16px;height:16px}
  .bottom-nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:var(--z-nav);
    max-width:536px;margin:0 auto;display:flex;padding:6px;border-radius:22px;
    background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);
    box-shadow:var(--shadow-md),inset 0 0 0 1px var(--line)}
  body.no-nav .bottom-nav,body.no-nav .cart-bar{display:none!important}
  .bottom-nav button{flex:1;position:relative;padding:7px 0 6px;font-size:10.5px;font-weight:700;color:var(--muted);
    display:flex;flex-direction:column;gap:3px;align-items:center;border-radius:16px;transition:color .2s,background .2s}
  .bottom-nav button svg.i{width:22px;height:22px}
  .bottom-nav button.active{color:var(--accent);background:var(--accent-soft)}
  .bottom-nav button.active svg.i{stroke-width:2.2}
  .nav-badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    background:var(--ink);color:var(--ink-text);font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--surface);font-variant-numeric:tabular-nums}
  .nav-badge.show{display:flex}

  /* Lists / panels */
  .panel{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .panel-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:12px}
  .line-item{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface);border-radius:var(--r-lg);
    margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .thumb{width:64px;height:64px;border-radius:14px;background:var(--surface-2);flex-shrink:0;overflow:hidden;
    display:grid;place-items:center;font-size:30px}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .grow{flex:1;min-width:0}
  .li-name{font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .li-sum{font-size:15px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .line-item .stepper{width:112px;flex-shrink:0}
  .line-item .stepper button{width:32px;height:32px}
  .muted{color:var(--muted);font-size:12.5px;font-weight:600}
  .total-line{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;padding:5px 0;font-variant-numeric:tabular-nums}
  .total-line span:first-child{color:var(--muted)}
  .total-line.big{font-size:18px;font-weight:800;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;letter-spacing:-.02em}
  .total-line.big span:first-child{color:var(--text)}

  /* Empty */
  .empty{text-align:center;padding:56px 24px 40px}
  .empty-ic{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm);
    display:grid;place-items:center;color:var(--accent)}
  .empty-ic svg.i{width:32px;height:32px;stroke-width:1.6}
  .empty h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .empty p{color:var(--muted);font-size:13.5px;font-weight:600;max-width:28ch;margin:0 auto 18px}
  .empty .btn{width:auto;display:inline-flex;padding:12px 20px}

  /* Skeleton */
  .sk{background:var(--surface);border-radius:var(--r-lg);padding:6px 6px 14px}
  .sk .b{background:linear-gradient(90deg,var(--surface-2) 0%,color-mix(in srgb,var(--surface-2) 50%,var(--surface)) 50%,var(--surface-2) 100%);
    background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:12px}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* Form */
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 2px 7px}
  .field .err{display:none;font-size:12px;font-weight:700;color:var(--danger);margin:6px 2px 0}
  .field.invalid input,.field.invalid textarea{border-color:var(--danger);background:var(--danger-soft)}
  .field.invalid .err{display:block}
  .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .seg button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-md);background:var(--surface-2);
    font-size:13.5px;font-weight:700;color:var(--muted);text-align:left;box-shadow:inset 0 0 0 1.5px transparent;transition:all .2s}
  .seg button .sic{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex-shrink:0}
  .seg button .sic svg.i{width:18px;height:18px}
  .seg button small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg button > span:last-child{min-width:0}
  .seg button.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .seg button.active .sic{background:var(--accent);color:#fff}
  .pay-note{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700}
  .pay-note .sic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .sticky-cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;margin-top:16px}
  .sticky-cta .btn{box-shadow:var(--shadow-md)}
  .hint{text-align:center;margin-top:10px}

  /* Success */
  .success{text-align:center;padding:36px 8px 0}
  .success-mark{width:96px;height:96px;margin:0 auto 20px;border-radius:32px;background:var(--accent);color:#fff;display:grid;place-items:center;
    box-shadow:0 20px 40px -18px var(--accent);animation:pop .5s var(--ease)}
  .success-mark svg.i{width:46px;height:46px;stroke-width:2.6}
  .success-mark path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .25s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .success h2{font-size:24px;font-weight:800;letter-spacing:-.035em;margin-bottom:8px}
  .invoice{display:inline-block;margin:4px 0 14px;padding:7px 12px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow-sm);
    font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .notice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r-md);
    background:color-mix(in srgb,#e9a23b 16%,var(--surface));font-size:13.5px;font-weight:600;line-height:1.45;margin:6px 0 18px}
  .notice svg.i{color:#c07a12;margin-top:1px}
  .stack{display:grid;gap:8px}

  /* Orders */
  .order-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
  .order-head b{font-size:15px;letter-spacing:-.01em}
  .pill{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
  .order-items{margin:10px 0 12px;font-size:13px;font-weight:600;line-height:1.7;color:var(--text);opacity:.85}

  /* Modal (bottom sheet) */
  .modal-bg{position:fixed;inset:0;background:rgba(10,14,11,.5);z-index:var(--z-modal);display:none;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .modal-bg.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{position:relative;background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-width:560px;
    padding:10px 16px calc(22px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;animation:up .32s var(--ease)}
  @keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
  .grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;background:color-mix(in srgb,var(--muted) 45%,transparent)}
  .modal-close{position:absolute;top:22px;right:26px;z-index:2;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--shadow-sm)}
  .modal-media{aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--surface-2)}
  .modal-media img{width:100%;height:100%;object-fit:cover}
  .modal-media .emoji{width:100%;height:100%;display:grid;place-items:center;font-size:96px}
  .modal-cat{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin:16px 2px 4px}
  .modal h3{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.03em;margin:0 2px 8px;text-wrap:balance}
  .modal .desc{color:var(--muted);font-size:14.5px;font-weight:500;line-height:1.55;margin:0 2px}
  .modal-buy{display:flex;align-items:center;gap:12px;margin-top:20px}
  .modal-buy .price{font-size:24px;flex-shrink:0;margin-left:2px}
  .modal-buy .grow .stepper{padding:5px}
  .modal-buy .grow .stepper button{width:44px;height:40px}

  /* Toast */
  .toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;z-index:var(--z-toast);
    transform:translateX(-50%) translateY(-120px);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);
    background:var(--ink);color:var(--ink-text);padding:11px 16px 11px 12px;border-radius:14px;font-size:13.5px;font-weight:700;
    transition:transform .35s var(--ease);box-shadow:var(--shadow-md);white-space:nowrap}
  .toast svg.i{width:18px;height:18px;color:var(--accent)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* Admin */
  #page-admin{padding-bottom:84px}
  .admin-item{background:var(--surface);border-radius:var(--r-lg);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .admin-item input{padding:10px 11px;font-size:15px;border-radius:11px}
  .admin-item .admin-top{margin-bottom:10px}
  .admin-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  .admin-top b{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .admin-top .muted{margin-left:6px}
  .admin-tools{display:flex;gap:4px;flex-shrink:0}
  .admin-tools .btn{width:34px;height:34px;padding:0;border-radius:10px}
  .admin-tools .btn svg.i{width:16px;height:16px}
  .admin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .admin-photo{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  .admin-photo .thumb{width:76px;height:76px}
  .admin-photo .stack{flex:1}

  .adm-bar{position:sticky;top:62px;z-index:20;margin:0 -16px;padding:6px 16px 10px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .adm-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin-bottom:8px}
  .adm-tabs button{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border-radius:11px;
    font-size:13.5px;font-weight:800;color:var(--muted);transition:background .2s,color .2s}
  .adm-tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
  .cnt{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
  .adm-tabs button.active .cnt{background:var(--accent-soft);color:var(--accent)}
  .adm-search{margin:0}
  .adm-links{display:flex;justify-content:flex-end;gap:14px;margin:2px 2px 8px}

  .adm-group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);margin-bottom:10px;overflow:hidden}
  .adm-ghead{width:100%;display:flex;align-items:center;gap:10px;padding:15px 14px;text-align:left;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
  .adm-ghead .chev{width:18px;height:18px;color:var(--muted);transition:transform .2s var(--ease)}
  .adm-group.open .adm-ghead .chev{transform:rotate(90deg);color:var(--accent)}
  .adm-ghead .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .adm-out{font-size:11.5px;font-weight:700;color:var(--danger);white-space:nowrap}
  .adm-gbody{display:none;border-top:1px solid var(--line);padding:6px}
  .adm-group.open .adm-gbody{display:block}

  .adm-row{border-radius:14px;scroll-margin-top:190px;transition:background .2s}
  .adm-row + .adm-row{margin-top:2px}
  .adm-row.editing{background:var(--surface-2)}
  .adm-rline{display:flex;align-items:center;gap:10px;padding:7px 8px}
  .adm-rhead{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
  .adm-rhead .thumb{width:46px;height:46px;border-radius:11px;font-size:22px}
  .adm-rhead .grow{display:flex;flex-direction:column;gap:2px}
  .adm-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .adm-meta{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .adm-meta .out{color:var(--danger)}
  .adm-row.is-out .thumb img{filter:grayscale(1);opacity:.6}
  .adm-rhead .edit{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
  .adm-rhead .edit svg.i{width:16px;height:16px}
  .adm-row.editing .adm-rhead .edit{background:var(--accent);color:#fff}
  .sw{position:relative;width:44px;height:26px;border-radius:13px;flex-shrink:0;transition:background .2s;
    background:color-mix(in srgb,var(--muted) 38%,transparent)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(18px)}

  .adm-form{padding:4px 10px 12px}
  .adm-l{font-size:12px;font-weight:700;color:var(--muted);margin:12px 2px 6px}
  .adm-form input,.adm-form select{padding:10px 11px;font-size:15px;border-radius:11px;background:var(--surface)}
  .lang-in{position:relative;margin-bottom:6px}
  .lang-in span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;letter-spacing:.04em;
    color:var(--muted);background:var(--surface-2);padding:3px 6px;border-radius:6px;pointer-events:none}
  .lang-in input{padding-left:48px}
  .adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .adm-actions{display:flex;gap:8px;margin-top:14px}
  .adm-actions .btn{flex:1}
  .btn-dashed{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--muted) 35%,transparent)}
  .adm-gbody > .btn-dashed{width:calc(100% - 4px);margin:6px 2px 2px}
  .adm-save{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:var(--z-nav);max-width:536px;margin:0 auto;
    display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--surface);color:var(--text);
    box-shadow:var(--shadow-md),inset 0 0 0 1px var(--line);transition:background .25s,color .25s}
  .adm-save .st{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
  .adm-save .st svg.i{width:17px;height:17px;color:var(--accent)}
  .adm-save .dot{width:8px;height:8px;border-radius:50%;background:#f0a020;box-shadow:0 0 0 3px rgba(240,160,32,.25);flex-shrink:0}
  .adm-save .btn{width:auto;padding:12px 18px}
  .adm-save.dirty{background:var(--ink);color:var(--ink-text)}
  .adm-save.dirty .st{color:var(--ink-text)}

  @media (min-width:520px){ .grid{gap:12px} .hero{padding:24px 22px 22px} .hero-title{font-size:26px} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<!-- Заставка с анимированным логотипом (один раз за сеанс) -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-in">
    <div class="sp-mark"><img class="sp-lines" src="assets/logo-lines.png" alt=""><img class="sp-cart" src="assets/logo-cart.png" alt=""></div>
    <img class="sp-word" src="assets/logo-word.png" alt="e-bazar">
    <img class="sp-slogan" src="assets/logo-slogan.png" alt="Doim siz uchun xizmatda. Sifatli va tezkor albatta">
  </div>
</div>

<header class="header">
  <div class="header-in">
    <div class="logo" id="logoBtn" aria-label="e-bazar"><span class="brand-mark"><img class="bm-lines" src="assets/logo-lines.png" alt=""><img class="bm-cart" src="assets/logo-cart.png" alt=""></span><span class="brand-word"><i>e-</i>bazar</span></div>
    <div class="lang-switch" id="langSwitch"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Theme"></button>
  </div>
</header>

<main class="container">

  <!-- ГЛАВНАЯ -->
  <section class="page" id="page-home">
    <div class="hero">
      <div class="hero-eyebrow">Doim siz uchun xizmatda</div>
      <div class="hero-title" data-i18n="promoTitle"></div>
      <div class="hero-list">
        <div><span class="tick" data-ic="check"></span><span data-i18n="promo1"></span></div>
        <div><span class="tick" data-ic="check"></span><span data-i18n="promo2"></span></div>
        <div><span class="tick" data-ic="check"></span><span data-i18n="promo3"></span></div>
      </div>
      <div class="hero-contacts" id="promoContacts"></div>
    </div>
    <div class="search-box">
      <span class="s-ic" data-ic="search"></span>
      <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="Clear" data-ic="x"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="grid" id="productGrid"></div>
  </section>

  <!-- ИЗБРАННОЕ -->
  <section class="page" id="page-fav">
    <div class="page-head"><h2 data-i18n="favorites"></h2></div>
    <div class="grid" id="favGrid"></div>
    <div class="empty" id="favEmpty" style="display:none">
      <div class="empty-ic" data-ic="heart"></div>
      <h3 data-i18n="emptyFav"></h3><p data-i18n="emptyFavHint"></p>
      <button class="btn btn-soft" onclick="go('home')" data-i18n="toCatalog"></button>
    </div>
  </section>

  <!-- КОРЗИНА -->
  <section class="page" id="page-cart">
    <div class="page-head"><h2 data-i18n="cart"></h2><button class="link-btn" id="clearCartBtn" onclick="clearCart()" data-i18n="clearCart"></button></div>
    <div id="cartList"></div>
    <div class="empty" id="cartEmpty" style="display:none">
      <div class="empty-ic" data-ic="bag"></div>
      <h3 data-i18n="emptyCart"></h3><p data-i18n="emptyCartHint"></p>
      <button class="btn btn-soft" onclick="go('home')" data-i18n="toCatalog"></button>
    </div>
    <div id="cartSummary" style="display:none">
      <div class="panel" style="margin-top:4px">
        <div class="total-line"><span data-i18n="subtotal"></span><span id="cartSub"></span></div>
        <div class="total-line"><span data-i18n="deliveryFeeLbl"></span><span id="cartFee"></span></div>
        <div class="total-line big"><span data-i18n="total"></span><span id="cartTotal"></span></div>
      </div>
      <div class="sticky-cta" style="bottom:calc(96px + env(safe-area-inset-bottom))">
        <button class="btn btn-primary" onclick="go('checkout')"><span data-i18n="goCheckout"></span><span data-ic="arrowR"></span></button>
      </div>
    </div>
  </section>

  <!-- ОФОРМЛЕНИЕ -->
  <section class="page" id="page-checkout">
    <div class="page-head"><button class="back-btn" onclick="goBack()" aria-label="Back" data-ic="arrowL"></button><h2 data-i18n="checkout"></h2></div>

    <div class="panel">
      <div class="panel-title" data-i18n="contacts"></div>
      <div class="field"><label for="fName" data-i18n="yourName"></label><input id="fName" autocomplete="name"><div class="err" data-i18n="errName"></div></div>
      <div class="field"><label for="fPhone" data-i18n="phone"></label><input id="fPhone" type="tel" inputmode="tel" placeholder="+90 5xx xxx xx xx" autocomplete="tel"><div class="err" data-i18n="errPhone"></div></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-i18n="deliveryMethod"></div>
      <div class="seg" id="segDelivery">
        <button data-val="delivery" class="active"><span class="sic" data-ic="truck"></span><span data-i18n="delivery"></span></button>
        <button data-val="pickup"><span class="sic" data-ic="store"></span><span data-i18n="pickup"></span></button>
      </div>
      <div class="field" id="addressField" style="margin-top:14px"><label for="fAddress" data-i18n="address"></label><textarea id="fAddress" rows="2" autocomplete="street-address"></textarea><div class="err" data-i18n="errAddress"></div></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-i18n="manager"></div>
      <div class="seg" id="segManager"></div>
    </div>

    <div class="panel">
      <div class="panel-title" data-i18n="payment"></div>
      <div class="pay-note"><span class="sic" data-ic="cash"></span><div><div data-i18n="payCash"></div><div class="muted" data-i18n="cashOnly"></div></div></div>
    </div>

    <div class="panel">
      <div class="field"><label for="fComment" data-i18n="comment"></label><textarea id="fComment" rows="2"></textarea></div>
    </div>

    <div class="panel" id="checkoutSummary"></div>
    <div class="sticky-cta">
      <button class="btn btn-primary" id="placeOrderBtn" onclick="placeOrder()"><span data-ic="send"></span><span data-i18n="sendOrder"></span></button>
    </div>
    <p class="muted hint" data-i18n="orderHint"></p>
  </section>

  <!-- УСПЕХ -->
  <section class="page" id="page-success">
    <div class="success">
      <div class="success-mark" data-ic="check"></div>
      <h2 data-i18n="orderAccepted"></h2>
      <div class="invoice" id="successInvoice"></div>
      <div class="notice"><span data-ic="info"></span><span data-i18n="orderSentHint"></span></div>
      <div class="stack">
        <button class="btn btn-primary" onclick="reopenChat()"><span data-ic="send"></span><span data-i18n="openChat"></span></button>
        <button class="btn btn-ghost" onclick="go('home')" data-i18n="backToShop"></button>
      </div>
    </div>
  </section>

  <!-- МОИ ЗАКАЗЫ -->
  <section class="page" id="page-orders">
    <div class="page-head"><h2 data-i18n="myOrders"></h2></div>
    <div id="ordersList"></div>
    <div class="empty" id="ordersEmpty" style="display:none">
      <div class="empty-ic" data-ic="receipt"></div>
      <h3 data-i18n="emptyOrders"></h3><p data-i18n="emptyOrdersHint"></p>
      <button class="btn btn-soft" onclick="go('home')" data-i18n="toCatalog"></button>
    </div>
  </section>

  <!-- АДМИН -->
  <section class="page" id="page-admin">
    <div class="page-head"><button class="back-btn" onclick="goBack()" aria-label="Back" data-ic="arrowL"></button><h2>Admin</h2></div>
    <div id="adminLogin" class="panel">
      <div class="field"><label for="adminPassInput" data-i18n="adminGhToken"></label><input id="adminPassInput" type="password" autocomplete="off"></div>
      <button class="btn btn-primary" onclick="adminLogin()"><span data-ic="key"></span><span data-i18n="signIn"></span></button>
      <p class="muted" style="margin-top:12px;line-height:1.5" data-i18n="adminGhHint"></p>
    </div>
    <div id="adminPanel" style="display:none">
      <div class="adm-bar">
        <div class="adm-tabs">
          <button data-tab="products" onclick="admSetTab('products')"><span data-i18n="productsTitle"></span><span class="cnt" id="admCount"></span></button>
          <button data-tab="cats" onclick="admSetTab('cats')"><span data-i18n="tabSections"></span><span class="cnt" id="admCatCount"></span></button>
        </div>
        <div class="search-box adm-search" id="admSearchBox">
          <span class="s-ic" data-ic="search"></span>
          <input id="admSearch" type="search" autocomplete="off" enterkeyhint="search">
          <button class="search-clear" id="admSearchClear" aria-label="Clear" data-ic="x"></button>
        </div>
      </div>
      <div id="admPaneProducts">
        <div class="adm-links" id="admLinks"><button class="link-btn" onclick="admAll(true)" data-i18n="expandAll"></button><button class="link-btn" onclick="admAll(false)" data-i18n="collapseAll"></button></div>
        <div id="adminList"></div>
      </div>
      <div id="admPaneCats" style="display:none">
        <div id="adminCats"></div>

/* ============================================================ ЛОГИКА ============================================================ */
const tg = window.Telegram?.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) { tg.ready(); tg.expand(); }

let PRODUCTS = [];
let CATS = DEFAULT_CATEGORIES;
let catalogLoaded = false;
let lang = localStorage.getItem("lang") || (tg?.initDataUnsafe?.user?.language_code?.slice(0,2)) || "ru";
if (!I18N[lang]) lang = "ru";
let cart = {}; try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e){}
let favs = []; try { favs = JSON.parse(localStorage.getItem("favs") || "[]"); } catch(e){}
let currentCat = "all", search = "", curPage = "home", modalProductId = null;
let deliveryMode = "delivery", managerIdx = 0, lastOrderLink = "";
const payMode = "cash"; // оплата только наличными
let adminToken = localStorage.getItem("ghKey") || "";

const $ = id => document.getElementById(id);
const t = (k) => (I18N[lang][k] ?? I18N.ru[k] ?? k);
const fmt = n => new Intl.NumberFormat("tr-TR", {maximumFractionDigits:2}).format(n) + " " + CONFIG.currency;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pname = p => p.name?.[lang] || p.name?.ru || p.name?.uz || p.name?.tr || p.name?.en || "";
const pdesc = p => p.desc?.[lang] || p.desc?.ru || p.desc?.uz || p.desc?.tr || p.desc?.en || "";
const punit = p => t(p.unit || "pcs");
const catName = c => c.name?.[lang] || c.name?.ru || c.name?.uz || c.name?.tr || c.name?.en || c.id;
const LOCALES = {ru:"ru-RU", uz:"uz-UZ", tr:"tr-TR"};
function itemsLabel(n){
  const f = t("items"); if (!Array.isArray(f)) return n + " " + f;
  const m10 = n % 10, m100 = n % 100;
  const i = (m10===1 && m100!==11) ? 0 : (m10>=2 && m10<=4 && (m100<10 || m100>=20)) ? 1 : 2;
  return n + " " + f[i];
}
function haptic(kind="light"){ try { if (inTg && tg.HapticFeedback) kind==="success" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred(kind); } catch(e){} }

/* Тема */
let theme = localStorage.getItem("theme") || (inTg ? tg.colorScheme : null) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $("themeBtn").innerHTML = ic(theme==="dark" ? "sun" : "moon");
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  document.querySelector('meta[name="theme-color"]').content = bg;
  if (inTg) { try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch(e){} }
}
$("themeBtn").onclick = () => { theme = theme==="dark"?"light":"dark"; localStorage.setItem("theme",theme); applyTheme(); };

/* Язык */
function renderLangSwitch(){
  $("langSwitch").innerHTML = ["ru","uz","tr"].map(l =>
    `<button class="${l===lang?'active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
}
function setLang(l){ lang=l; localStorage.setItem("lang",l); document.documentElement.lang = l; renderAll(); }
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("searchInput").placeholder = t("search");
  $("admSearch").placeholder = t("admSearch");
}

/* Навигация */
const NO_NAV = ["checkout","success","admin"];
function go(page){
  curPage = page;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  $("page-"+page).classList.add("active");
  document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.toggle("active", b.dataset.page===page));
  document.body.classList.toggle("no-nav", NO_NAV.includes(page));
  if (page==="cart") renderCart();
  if (page==="fav") renderFavs();
  if (page==="orders") renderOrders();
  if (page==="checkout") { if (!cartItems().length) return go("cart"); renderCheckoutSummary(); }
  if (page==="admin") renderAdmin();
  renderCartBar();
  if (inTg && tg.BackButton) { try { page==="home" ? tg.BackButton.hide() : tg.BackButton.show(); } catch(e){} }
  window.scrollTo({top:0, behavior:"instant"});
}
function goBack(){
  if ($("modalBg").classList.contains("open")) return closeModal();
  go(curPage==="checkout" ? "cart" : "home");
}
if (inTg && tg.BackButton) { try { tg.BackButton.onClick(goBack); } catch(e){} }
document.querySelectorAll(".bottom-nav button").forEach(b => b.onclick = () => go(b.dataset.page));

/* Вход в админку: 5 быстрых нажатий на логотип или адрес сайта + #admin */
let logoTaps=0, logoTimer;
$("logoBtn").onclick = () => {
  logoTaps++; clearTimeout(logoTimer); logoTimer=setTimeout(()=>logoTaps=0,1500);
  if (logoTaps>=5){ logoTaps=0; go("admin"); }
};

/* Каталог */
function renderChips(){
  const has = id => PRODUCTS.some(p => p.cat===id);
  $("chips").innerHTML =
    `<button class="chip ${currentCat==="all"?'active':''}" onclick="setCat('all')">${t("all")}</button>` +
    CATS.filter(c => !catalogLoaded || has(c.id)).map(c =>
      `<button class="chip ${c.id===currentCat?'active':''}" data-cat="${esc(c.id)}" onclick="setCat(this.dataset.cat)">${esc(catName(c))}</button>`).join("");
}
function setCat(c){ currentCat=c; renderChips(); renderGrid(); }
$("searchInput").oninput = e => { search = e.target.value.trim().toLowerCase(); $("searchClear").classList.toggle("show", !!search); renderGrid(); };
$("searchClear").onclick = () => { $("searchInput").value=""; search=""; $("searchClear").classList.remove("show"); renderGrid(); $("searchInput").focus(); };

function mediaHtml(p, cls=""){
  return p.img ? `<img src="${esc(p.img)}" alt="${esc(pname(p))}" loading="lazy" decoding="async">`
               : `<div class="emoji">${p.emoji ? esc(p.emoji) : ic("photo")}</div>`;
}
function productCard(p){
  const q = cart[p.id] || 0, out = p.stock===false;
  return `<article class="card${out?' is-out':''}" data-pid="${p.id}" onclick="openModal(${p.id})">
    <div class="media">
      ${mediaHtml(p)}
      <button class="fav ${favs.includes(p.id)?'on':''}" aria-label="${t("navFav")}" onclick="event.stopPropagation();toggleFav(${p.id})">${ic("heart")}</button>
      ${out?`<span class="tag-out">${t("outStock")}</span>`:""}
      <div class="buy" onclick="event.stopPropagation()">
        ${out ? "" : q ? stepperHtml(p.id, q, "mini") :
          `<button class="fab" aria-label="${t("add")}" onclick="addToCart(${p.id})">${ic("plus")}</button>`}
      </div>
    </div>
    <div class="info">
      <div class="price">${fmt(p.price)}<small> / ${punit(p)}</small></div>
      <h3 class="name">${esc(pname(p))}</h3>
    </div>
  </article>`;
}
function stepperHtml(id, qty, cls=""){
  return `<div class="stepper ${cls}">
    <button aria-label="−" onclick="changeQty(${id},-1)">${ic(qty===1 && cls!=="mini" ? "trash" : "minus")}</button>
    <span>${qty}</span>
    <button aria-label="+" onclick="changeQty(${id},1)">${ic("plus")}</button>
  </div>`;
}
function skeletons(n=6){
  return Array.from({length:n}, () => `<div class="sk"><div class="b" style="aspect-ratio:1/1;border-radius:15px"></div>
    <div class="b" style="height:14px;width:50%;margin:12px 6px 8px"></div><div class="b" style="height:11px;width:80%;margin:0 6px"></div></div>`).join("");
}
function matches(p){
  if (!search) return true;
  const hay = [...Object.values(p.name||{}), ...Object.values(p.desc||{})].join(" ").toLowerCase();
  return hay.includes(search);
}
function renderGrid(){
  if (!catalogLoaded) { $("productGrid").innerHTML = skeletons(); $("resultMeta").textContent = ""; return; }
  const list = PRODUCTS.filter(p => (currentCat==="all" || p.cat===currentCat) && matches(p));
  $("resultMeta").textContent = search ? itemsLabel(list.length) : "";
  $("productGrid").innerHTML = list.map(productCard).join("") ||
    `<div class="empty" style="grid-column:1/-1"><div class="empty-ic">${ic("search")}</div>
      <h3>${t("notFound")}</h3><p>${t("notFoundHint")}</p></div>`;
}
/* точечно обновляем карточку товара, не перерисовывая всю сетку */
function refreshProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if (!p) return;
  document.querySelectorAll(`.card[data-pid="${id}"]`).forEach(el => { el.outerHTML = productCard(p); });
}

/* Избранное */
function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs,id];
  localStorage.setItem("favs", JSON.stringify(favs));
  haptic("light");
  refreshProduct(id); if(curPage==="fav") renderFavs();
}
function renderFavs(){
  const list = PRODUCTS.filter(p => favs.includes(p.id));
  $("favGrid").innerHTML = list.map(productCard).join("");
  $("favEmpty").style.display = list.length ? "none" : "block";
}

/* Корзина */
function addToCart(id){ cart[id]=(cart[id]||0)+1; haptic("light"); bumpLogo(); saveCart(id); toast(t("added")); }
function changeQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  haptic("light"); saveCart(id);
}
function clearCart(){ cart = {}; saveCart(); toast(t("cartCleared")); }
function saveCart(changedId){
  localStorage.setItem("cart", JSON.stringify(cart));
  if (changedId!=null) refreshProduct(changedId); else { renderGrid(); if(curPage==="fav") renderFavs(); }
  renderCartBar();
  if(curPage==="cart") renderCart();
  if(curPage==="checkout") renderCheckoutSummary();
  if(modalProductId!==null && $("modalBg").classList.contains("open")) renderModal(modalProductId);
}
function cartItems(){ return Object.entries(cart).map(([id,qty]) => ({p:PRODUCTS.find(x=>x.id==id), qty})).filter(x=>x.p && x.p.stock!==false); }
function cartTotal(){ return cartItems().reduce((s,{p,qty}) => s+p.price*qty, 0); }
function renderCartBar(){
  const n = cartItems().reduce((s,x)=>s+x.qty,0);
  $("cartBar").style.display = (n && (curPage==="home" || curPage==="fav" || curPage==="orders")) ? "block" : "none";
  $("cartBarCount").textContent = itemsLabel(n);
  $("cartBarSum").textContent = fmt(cartTotal());
  $("navBadge").textContent = n > 99 ? "99+" : n;
  $("navBadge").classList.toggle("show", n>0);
}
function renderCart(){
  const items = cartItems();
  $("cartEmpty").style.display = items.length ? "none" : "block";
  $("cartSummary").style.display = items.length ? "block" : "none";
  $("clearCartBtn").style.display = items.length ? "" : "none";
  $("cartList").innerHTML = items.map(({p,qty}) => `
    <div class="line-item">
      <div class="thumb" onclick="openModal(${p.id})">${p.img?`<img src="${esc(p.img)}" alt="${esc(pname(p))}">`:(p.emoji?esc(p.emoji):ic("photo"))}</div>
      <div class="grow">
        <div class="li-name">${esc(pname(p))}</div>
        <div class="muted num">${fmt(p.price)} / ${punit(p)}</div>
        <div class="li-sum">${fmt(p.price*qty)}</div>
      </div>
      ${stepperHtml(p.id, qty)}
    </div>`).join("");
  const fee = CONFIG.deliveryFee;
  $("cartSub").textContent = fmt(cartTotal());
  $("cartFee").textContent = fee ? fmt(fee) : t("free");
  $("cartTotal").textContent = fmt(cartTotal() + fee);
}

/* Оформление */
document.querySelectorAll("#segDelivery button").forEach(b => b.onclick = () => {
  deliveryMode = b.dataset.val;
  document.querySelectorAll("#segDelivery button").forEach(x=>x.classList.toggle("active",x===b));
  $("addressField").style.display = deliveryMode==="delivery" ? "block" : "none";
  renderCheckoutSummary();
});
function renderManagers(){
  $("segManager").innerHTML = CONFIG.managers.map((m,i) =>
    `<button class="${i===managerIdx?'active':''}" onclick="managerIdx=${i};renderManagers()">
      <span class="sic">${ic("user")}</span><span>${t(m.key)}<small>@${esc(m.username)}</small></span></button>`).join("");
  $("promoContacts").innerHTML = CONFIG.managers.map(m =>
    `<a href="https://t.me/${esc(m.username)}" target="_blank" rel="noopener">${ic("send")}${t(m.key)}</a>`).join("") +
    (CONFIG.phone ? `<a href="tel:${esc(CONFIG.phone)}">${ic("phone")}<span class="num">${esc(CONFIG.phone)}</span></a>` : "");
}

function renderCheckoutSummary(){
  const items = cartItems();
  const fee = deliveryMode==="delivery" ? CONFIG.deliveryFee : 0;
  $("checkoutSummary").innerHTML = `<div class="panel-title">${itemsLabel(items.reduce((s,x)=>s+x.qty,0))}</div>` +
    items.map(({p,qty}) => `<div class="total-line"><span>${esc(pname(p))} × ${qty}</span><span>${fmt(p.price*qty)}</span></div>`).join("") +
    (deliveryMode==="delivery" ? `<div class="total-line"><span>${t("deliveryFeeLbl")}</span><span>${fee?fmt(fee):t("free")}</span></div>` : "") +
    `<div class="total-line big"><span>${t("total")}</span><span>${fmt(cartTotal()+fee)}</span></div>`;
}

/* Текст заказа, который уходит менеджеру в Telegram */
function orderText(order, invoice){
  const L = [];
  L.push(`🛍 ${t("orderTitle")} №${invoice}`);
  L.push("");
  order.items.forEach(i => L.push(`• ${i.name} — ${i.qty} × ${fmt(i.price)} = ${fmt(i.sum)}`));
  L.push("");
  if (order.deliveryFee > 0) L.push(`${t("deliveryFeeLbl")}: ${fmt(order.deliveryFee)}`);
  L.push(`💰 ${t("total")}: ${fmt(order.total)}`);
  L.push(`💵 ${t("payCash")}`);
  L.push("");
  L.push(`👤 ${order.name}`);
  L.push(`📞 ${order.phone}`);
  L.push(order.deliveryMode === "delivery" ? `🚚 ${t("delivery")}` : `🏪 ${t("pickup")}`);
  if (order.address && order.address !== "-") L.push(`📍 ${order.address}`);
  if (order.comment) L.push(`💬 ${order.comment}`);
  return L.join("\n");
}

function setErr(inputId, on){ $(inputId).closest(".field").classList.toggle("invalid", on); }
["fName","fPhone","fAddress"].forEach(id => $(id).addEventListener("input", () => setErr(id,false)));

function openLink(link){
  if (inTg && tg.openTelegramLink) { try { tg.openTelegramLink(link); return; } catch(e){} }
  window.open(link, "_blank");
}
function placeOrder(){
  const name = $("fName").value.trim(), phone = $("fPhone").value.trim();
  const address = deliveryMode==="delivery" ? $("fAddress").value.trim() : "-";
  const items = cartItems();
  if (!items.length) { go("home"); return; }
  const bad = { fName: !name, fPhone: phone.replace(/\D/g,"").length < 9, fAddress: deliveryMode==="delivery" && !address };
  Object.entries(bad).forEach(([id,v]) => setErr(id, v));
  const firstBad = Object.keys(bad).find(k => bad[k]);
  if (firstBad) { $(firstBad).focus(); $(firstBad).scrollIntoView({block:"center", behavior:"smooth"}); haptic("medium"); return; }
  if (CONFIG.minOrder && cartTotal() < CONFIG.minOrder) { toast(t("minOrderMsg") + fmt(CONFIG.minOrder)); return; }

  const fee = deliveryMode==="delivery" ? CONFIG.deliveryFee : 0;
  const order = {
    name, phone, address, comment: $("fComment").value.trim(),
    deliveryMode, payMode, lang,
    items: items.map(({p,qty}) => ({id:p.id, name:pname(p), price:p.price, unit:punit(p), qty, sum:p.price*qty})),
    total: cartTotal()+fee, deliveryFee: fee,
  };
  const invoice = new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.floor(1000 + Math.random()*9000);
  const manager = CONFIG.managers[managerIdx] || CONFIG.managers[0];
  lastOrderLink = `https://t.me/${manager.username}?text=${encodeURIComponent(orderText(order, invoice))}`;
  localStorage.setItem("profile", JSON.stringify({name, phone, address: address==="-" ? "" : address}));

  finishOrder(order, invoice);
  // открываем чат с менеджером — покупателю остаётся нажать «Отправить»
  openLink(lastOrderLink);
}
function reopenChat(){ if (lastOrderLink) openLink(lastOrderLink); else go("orders"); }
function finishOrder(order, invoice){
  let history = []; try { history = JSON.parse(localStorage.getItem("orders") || "[]"); } catch(e){}
  history.unshift({...order, invoice, date: new Date().toISOString(), link: lastOrderLink});
  localStorage.setItem("orders", JSON.stringify(history.slice(0,50)));
  cart = {}; saveCart();
  $("fComment").value = "";
  $("successInvoice").textContent = "№ " + invoice;
  go("success");
  haptic("success");
}
/* подставляем имя/телефон/адрес с прошлого заказа */
(function(){ try {
  const pr = JSON.parse(localStorage.getItem("profile") || "null");
  const u = tg?.initDataUnsafe?.user;
  $("fName").value = pr?.name || (u ? [u.first_name,u.last_name].filter(Boolean).join(" ") : "");
  $("fPhone").value = pr?.phone || "";
  $("fAddress").value = pr?.address || "";
} catch(e){} })();

/* Мои заказы */
function getOrders(){ try { return JSON.parse(localStorage.getItem("orders") || "[]"); } catch(e){ return []; } }
function renderOrders(){
  const history = getOrders();
  $("ordersEmpty").style.display = history.length ? "none" : "block";
  $("ordersList").innerHTML = history.map((o,idx) => `
    <div class="panel">
      <div class="order-head"><b>${t("orderNum")} №${esc(o.invoice)}</b><span class="pill">${fmt(o.total)}</span></div>
      <div class="muted">${esc(new Date(o.date).toLocaleString(LOCALES[lang]||"ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}))}</div>
      <div class="order-items">${o.items.map(i => `${esc(i.name)} × ${i.qty} — <span class="num">${fmt(i.sum)}</span>`).join("<br>")}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-soft btn-sm" onclick="repeatOrder(${idx})">${ic("repeat")}${t("repeatOrder")}</button>
        ${o.link ? `<button class="btn btn-ghost btn-sm" onclick="openLink(getOrders()[${idx}].link)">${ic("send")}Telegram</button>` : ""}
      </div>
    </div>`).join("");
}
function repeatOrder(idx){
  const o = getOrders()[idx]; if (!o) return;
  o.items.forEach(i => { const p = PRODUCTS.find(x=>x.id===i.id); if (p && p.stock!==false) cart[p.id] = (cart[p.id]||0) + i.qty; });
  saveCart(); toast(t("repeated")); go("cart");
}

/* Модалка товара */
function renderModal(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  const qty = cart[p.id]||0, cat = CATS.find(c=>c.id===p.cat);
  $("modalBody").innerHTML = `
    <div class="modal-media">${p.img?`<img src="${esc(p.img)}" alt="${esc(pname(p))}">`:`<div class="emoji">${p.emoji?esc(p.emoji):ic("photo")}</div>`}</div>
    ${cat?`<div class="modal-cat">${esc(catName(cat))}</div>`:`<div style="height:16px"></div>`}
    <h3>${esc(pname(p))}</h3>
    ${pdesc(p)?`<p class="desc">${esc(pdesc(p))}</p>`:""}
    <div class="modal-buy">

/* --- сохранение в GitHub --- */
const gh = (path) =>
  `https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}/contents/${path}`;
const ghHeaders = () => ({
  Authorization: "Bearer " + adminToken,
  Accept: "application/vnd.github+json",
  "Content-Type": "application/json",
});

/* свежий номер версии файла (без кэша) */
async function ghSha(path){
  const q = "?ref=" + encodeURIComponent(CONFIG.github.branch) + "&_=" + Date.now();
  /* 1) прямой запрос файла.
     ВАЖНО: заголовок If-None-Match здесь не ставим — GitHub отвечал на него 304,
     res.ok становился false, sha терялся и запись падала с 422 "sha wasn't supplied". */
  try {
    const res = await fetch(gh(path) + q, { headers: ghHeaders(), cache: "no-store" });
    if (res.ok) {
      const j = await res.json();
      if (j && j.sha) return j.sha;
    }
    if (res.status === 404) return undefined;   // файла ещё нет — создаём новый
  } catch(e){}
  /* 2) запасной путь: ищем файл в списке содержимого папки */
  try {
    const dir = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
    const res = await fetch(gh(dir) + q, { headers: ghHeaders(), cache: "no-store" });
    if (res.ok) {
      const list = await res.json();
      if (Array.isArray(list)) {
        const hit = list.find(f => f && f.path === path);
        if (hit && hit.sha) return hit.sha;
      }
    }
  } catch(e){}
  return undefined;
}

/* запись файла с повтором, если версия устарела (409) */
async function ghPut(path, contentBase64, message){
  let lastErr = "";
  for (let attempt = 1; attempt <= 4; attempt++) {
    const sha = await ghSha(path);
    const res = await fetch(gh(path), {
      method: "PUT",
      headers: ghHeaders(),
      body: JSON.stringify({ message, content: contentBase64, branch: CONFIG.github.branch, ...(sha ? {sha} : {}) })
    });
    if (res.ok) return res.json();

    let detail = "";
    try { detail = (await res.json()).message || ""; } catch(e){}
    lastErr = `${res.status} ${detail}`;

    // 409/422 — файл успели изменить: подождём и возьмём свежую версию
    if (res.status === 409 || res.status === 422) {
      await new Promise(r => setTimeout(r, 900 * attempt));
      continue;
    }
    throw new Error(lastErr);
  }
  throw new Error(lastErr);
}

/* utf-8 текст -> base64 (по кускам, чтобы не падало на больших каталогах) */
function toBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}

async function adminSave(){
  ensureDrafts();
  const btn = $("adminSaveBtn");
  const setBtn = (busy) => { if (btn) { btn.disabled = busy; btn.innerHTML = busy ? t("saving") : ic("check") + `<span>${t("save")}</span>`; } };
  setBtn(true);
  try {
    if (!adminToken) throw new Error("Ключ доступа не введён");
    // 1. фото, снятые на телефон, сохраняем отдельными файлами
    for (const p of adminDraft) {
      const m = typeof p.img === "string" && p.img.match(/^data:image\/(jpeg|jpg|png|webp);base64,(.+)$/);
      if (!m) continue;
      const ext = m[1] === "jpeg" ? "jpg" : m[1];
      const name = `${CONFIG.github.photos}/p${p.id}-${Date.now()}.${ext}`;
      await ghPut(name, m[2], "photo: " + name);
      p.img = name;
    }
    // 2. сам каталог
    const catalog = JSON.stringify({ products: adminDraft, categories: adminCatDraft }, null, 2);
    await ghPut(CONFIG.github.catalog, toBase64(catalog), "catalog update");

    PRODUCTS = JSON.parse(JSON.stringify(adminDraft));
    CATS = JSON.parse(JSON.stringify(adminCatDraft));
    if (currentCat!=="all" && !CATS.some(c=>c.id===currentCat)) currentCat="all";
    admDirty = false;
    toast(t("savedGh")); renderAll();
  } catch(e){
    console.error(e);
    let msg = String(e && e.message || e);
    if (msg.includes("Bad credentials") || msg.includes("401")) msg = "Ключ неверный или устарел";
    else if (msg.includes("Resource not accessible") || msg.includes("403")) msg = "У ключа нет прав на запись (Contents: Read and write)";
    else if (msg.includes("Not Found") || msg.includes("404")) msg = "Репозиторий не найден — проверьте доступ ключа к E-BAZAR";
    else if (msg.includes("409") || msg.includes("does not match")) msg = "Каталог изменился в другом окне. Обновите страницу и повторите";
    else if (msg.includes("422") || msg.includes("sha")) msg = "GitHub не отдал версию файла (sha). Проверьте, что у ключа есть доступ к репозиторию " + CONFIG.github.repo;
    else if (msg.length > 90) msg = t("saveFail");
    toast(msg, "info");
    const needNewKey = /401|403|404|прав|неверн|устарел|не найден/i.test(msg);
    if (needNewKey && confirm(msg + "\n\n" + t("askNewKey"))) adminLogout();
  } finally {
    setBtn(false);
  }
}
