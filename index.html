<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>E-Bazar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --text:#16181d; --muted:#8a8f98;
    --accent:#22a45d; --accent-2:#1c8b4f; --accent-soft:#e9f7f0;
    --card:#ffffff; --border:#ecedef; --danger:#e5484d;
    --radius:16px; --shadow:0 1px 4px rgba(0,0,0,.05);
  }
  [data-theme="dark"]{
    --bg:#0f1115; --text:#f2f3f5; --muted:#8b93a1;
    --accent:#2ebd6f; --accent-2:#27a862; --accent-soft:#15291e;
    --card:#171a20; --border:#242832; --shadow:0 1px 4px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:12px 14px;
    border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .container{max-width:520px;margin:0 auto;padding:0 14px 150px}

  /* Header */
  .header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);padding:12px 14px;display:flex;align-items:center;gap:8px;
    max-width:520px;margin:0 auto}
  .logo{font-size:19px;font-weight:800;flex:1;cursor:pointer;user-select:none}
  .logo span{color:var(--accent)}
  .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border);
    font-size:17px;display:flex;align-items:center;justify-content:center}
  .lang-switch{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .lang-switch button{padding:8px 9px;font-size:12px;font-weight:700;color:var(--muted)}
  .lang-switch button.active{background:var(--accent);color:#fff}

  /* Search + categories */
  .search-box{position:relative;margin:6px 0 10px}
  .search-box input{padding-left:40px}
  .search-box::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--border);
    font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* Product grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;
    display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative;cursor:pointer}
  .card .emoji{font-size:46px;line-height:1;text-align:center;padding:12px 0}
  .card img.photo{width:100%;height:110px;object-fit:cover;border-radius:12px}
  .card .name{font-size:14.5px;font-weight:700}
  .card .desc{font-size:11.5px;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .price{font-size:14.5px;font-weight:800}
  .price small{color:var(--muted);font-weight:500}
  .fav-btn{position:absolute;top:8px;right:8px;font-size:17px;z-index:2;filter:grayscale(1);opacity:.45}
  .fav-btn.on{filter:none;opacity:1}
  .badge-out{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;font-size:10px;
    font-weight:700;padding:3px 8px;border-radius:99px;z-index:2}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;
    border-radius:13px;font-size:14.5px;font-weight:700;transition:opacity .15s;text-align:center}
  .btn:active{opacity:.7}
  .btn:disabled{opacity:.45;cursor:default}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-soft{background:var(--accent-soft);color:var(--accent)}
  .btn-danger-soft{background:rgba(229,72,77,.12);color:var(--danger)}

  .stepper{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:13px;padding:4px}
  .stepper button{width:38px;height:36px;border-radius:10px;background:var(--card);color:var(--accent);font-size:18px;font-weight:800}
  .stepper span{font-size:14px;font-weight:800;color:var(--accent)}

  /* Cart bar + bottom nav */
  .cart-bar{position:fixed;left:0;right:0;bottom:74px;z-index:30;max-width:520px;margin:0 auto;padding:0 14px}
  .cart-bar-inner{display:flex;align-items:center;justify-content:space-between;background:var(--accent);color:#fff;
    border-radius:15px;padding:14px 18px;font-size:14px;font-weight:700;box-shadow:0 8px 22px rgba(34,164,93,.35);cursor:pointer}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--border);
    display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav button{flex:1;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:600}
  .bottom-nav button .ic{font-size:20px}
  .bottom-nav button.active{color:var(--accent)}

  /* Sections */
  .page{display:none}
  .page.active{display:block}
  h2.title{font-size:20px;font-weight:800;margin:16px 0 10px}
  .list-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:12px}
  .row .grow{flex:1;min-width:0}
  .row .thumb{font-size:32px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);border-radius:12px;flex-shrink:0;overflow:hidden}
  .row .thumb img{width:100%;height:100%;object-fit:cover}
  .muted{color:var(--muted);font-size:12.5px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:52px;margin-bottom:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .seg{display:flex;background:var(--card);border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
  .seg button{flex:1;padding:11px 4px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg button.active{background:var(--accent);color:#fff}
  .total-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
  .total-line.big{font-size:17px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:12px}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:20px 18px 30px;
    max-height:85vh;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .modal .emoji-big{font-size:84px;text-align:center;padding:14px 0}
  .modal img.photo-big{width:100%;max-height:230px;object-fit:cover;border-radius:16px}
  .modal h3{font-size:20px;font-weight:800;margin:10px 0 6px}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);z-index:99;
    background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:700;
    transition:transform .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .success-anim{font-size:80px;text-align:center;padding:30px 0 10px;animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

  /* Promo */
  .promo{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;
    border-radius:var(--radius);padding:16px 16px 14px;margin:6px 0 12px;box-shadow:0 6px 18px rgba(34,164,93,.28)}
  .promo-title{font-size:15.5px;font-weight:800;margin-bottom:8px;line-height:1.35}
  .promo-list{font-size:13px;line-height:1.75;opacity:.96}
  .promo-contacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .promo-contacts a{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.19);
    padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:700;color:#fff;text-decoration:none}
  .promo-contacts a:active{opacity:.75}

  /* Admin */
  .admin-item{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
  .admin-item input,.admin-item select{padding:8px 10px;font-size:13px;margin-top:6px}
  .admin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  .order-status{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>

<header class="header">
  <div class="logo" id="logoBtn">E-<span>Bazar</span> 🛍</div>
  <div class="lang-switch" id="langSwitch"></div>
  <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
</header>

<div class="container">

  <!-- ГЛАВНАЯ -->
  <section class="page" id="page-home">
    <div class="promo">
      <div class="promo-title">🌟 <b>E-BAZAR</b> — <span data-i18n="promoTitle"></span></div>
      <div class="promo-list">
        <div>🔹 <span data-i18n="promo1"></span></div>
        <div>🔹 <span data-i18n="promo2"></span></div>
        <div>🔹 <span data-i18n="promo3"></span></div>
      </div>
      <div class="promo-contacts" id="promoContacts"></div>
    </div>
    <div class="search-box"><input id="searchInput" type="search"></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="productGrid"></div>
  </section>

  <!-- ИЗБРАННОЕ -->
  <section class="page" id="page-fav">
    <h2 class="title" data-i18n="favorites"></h2>
    <div class="grid" id="favGrid"></div>
    <div class="empty" id="favEmpty" style="display:none"><div class="big">💚</div><div data-i18n="emptyFav"></div></div>
  </section>

  <!-- КОРЗИНА -->
  <section class="page" id="page-cart">
    <h2 class="title" data-i18n="cart"></h2>
    <div id="cartList"></div>
    <div class="empty" id="cartEmpty" style="display:none"><div class="big">🛒</div><div data-i18n="emptyCart"></div></div>
    <div id="cartSummary" class="list-card" style="display:none">
      <div class="total-line big"><span data-i18n="total"></span><b id="cartTotal"></b></div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="go('checkout')" data-i18n="goCheckout"></button>
    </div>
  </section>

  <!-- ОФОРМЛЕНИЕ -->
  <section class="page" id="page-checkout">
    <h2 class="title" data-i18n="checkout"></h2>
    <div class="field"><label data-i18n="yourName"></label><input id="fName" autocomplete="name"></div>
    <div class="field"><label data-i18n="phone"></label><input id="fPhone" type="tel" placeholder="+90 5xx xxx xx xx" autocomplete="tel"></div>
    <div class="field"><label data-i18n="deliveryMethod"></label>
      <div class="seg" id="segDelivery">
        <button data-val="delivery" class="active" data-i18n="delivery"></button>
        <button data-val="pickup" data-i18n="pickup"></button>
      </div>
    </div>
    <div class="field" id="addressField"><label data-i18n="address"></label><textarea id="fAddress" rows="2"></textarea></div>
    <div class="field"><label data-i18n="payment"></label>
      <div class="list-card" style="margin-bottom:0;padding:12px 14px">💵 <b data-i18n="payCash"></b> <span class="muted" data-i18n="cashOnly"></span></div>
    </div>
    <div class="field"><label data-i18n="manager"></label>
      <div class="seg" id="segManager"></div>
    </div>
    <div class="field"><label data-i18n="comment"></label><textarea id="fComment" rows="2"></textarea></div>
    <div class="list-card" id="checkoutSummary"></div>
    <button class="btn btn-primary" id="placeOrderBtn" onclick="placeOrder()" data-i18n="sendOrder"></button>
    <p class="muted" style="text-align:center;margin-top:8px" data-i18n="orderHint"></p>
  </section>

  <!-- УСПЕХ -->
  <section class="page" id="page-success">
    <div class="success-anim">✅</div>
    <h2 class="title" style="text-align:center" data-i18n="orderAccepted"></h2>
    <p class="muted" style="text-align:center" id="successInfo"></p>
    <div style="margin-top:20px"><button class="btn btn-soft" onclick="go('home')" data-i18n="backToShop"></button></div>
  </section>

  <!-- МОИ ЗАКАЗЫ -->
  <section class="page" id="page-orders">
    <h2 class="title" data-i18n="myOrders"></h2>
    <div id="ordersList"></div>
    <div class="empty" id="ordersEmpty" style="display:none"><div class="big">📦</div><div data-i18n="emptyOrders"></div></div>
  </section>

  <!-- АДМИН -->
  <section class="page" id="page-admin">
    <h2 class="title">⚙️ Admin</h2>
    <div id="adminLogin">
      <div class="field"><label data-i18n="adminGhToken"></label><input id="adminPassInput" type="password" autocomplete="off"></div>
      <button class="btn btn-primary" onclick="adminLogin()" data-i18n="signIn"></button>
      <p class="muted" style="margin-top:12px" data-i18n="adminGhHint"></p>
    </div>
    <div id="adminPanel" style="display:none">
      <h3 style="font-size:16px;font-weight:800;margin:8px 0 10px">📂 <span data-i18n="sections"></span></h3>
      <div id="adminCats"></div>
      <button class="btn btn-soft" onclick="adminCatAdd()" style="margin-bottom:18px">＋ <span data-i18n="addSection"></span></button>
      <h3 style="font-size:16px;font-weight:800;margin:8px 0 10px">📦 <span data-i18n="productsTitle"></span></h3>
      <div id="adminList"></div>
      <button class="btn btn-soft" onclick="adminAdd()" style="margin-bottom:10px">＋ <span data-i18n="addProduct"></span></button>
      <button class="btn btn-primary" id="adminSaveBtn" onclick="adminSave()" data-i18n="saveAll"></button>
      <button class="btn btn-danger-soft" style="margin-top:8px" onclick="adminLogout()" data-i18n="changeKey"></button>
      <p class="muted" style="margin-top:10px" data-i18n="adminNote"></p>
    </div>
  </section>

</div>

<!-- Панель корзины -->
<div class="cart-bar" id="cartBar" style="display:none">
  <div class="cart-bar-inner" onclick="go('cart')">
    <span>🛒 <span id="cartBarCount"></span></span><b id="cartBarSum"></b>
  </div>
</div>

<!-- Нижнее меню -->
<nav class="bottom-nav" id="bottomNav">
  <button data-page="home"><span class="ic">🏠</span><span data-i18n="navHome"></span></button>
  <button data-page="fav"><span class="ic">💚</span><span data-i18n="navFav"></span></button>
  <button data-page="cart"><span class="ic">🛒</span><span data-i18n="navCart"></span></button>
  <button data-page="orders"><span class="ic">📦</span><span data-i18n="navOrders"></span></button>
</nav>

<!-- Модалка товара -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

/* ============================================================ ЛОГИКА ============================================================ */
const tg = window.Telegram?.WebApp;
if (tg && tg.initData) { tg.ready(); tg.expand(); }

let PRODUCTS = DEFAULT_PRODUCTS;
let CATS = DEFAULT_CATEGORIES;
let lang = localStorage.getItem("lang") || (tg?.initDataUnsafe?.user?.language_code?.slice(0,2)) || "ru";
if (!I18N[lang]) lang = "ru";
let cart = {}; try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e){}
let favs = []; try { favs = JSON.parse(localStorage.getItem("favs") || "[]"); } catch(e){}
let currentCat = "all", search = "", curPage = "home", modalProductId = null;
let deliveryMode = "delivery", managerIdx = 0;
const payMode = "cash"; // оплата только наличными
let adminToken = localStorage.getItem("ghKey") || "";

const $ = id => document.getElementById(id);
const t = (k) => (I18N[lang][k] ?? k);
const fmt = n => new Intl.NumberFormat("tr-TR", {maximumFractionDigits:2}).format(n) + " " + CONFIG.currency;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pname = p => p.name?.[lang] || p.name?.ru || p.name?.uz || p.name?.tr || p.name?.en || "";
const pdesc = p => p.desc?.[lang] || p.desc?.ru || p.desc?.uz || p.desc?.tr || p.desc?.en || "";
const punit = p => t(p.unit || "pcs");
const catName = c => c.name?.[lang] || c.name?.ru || c.name?.uz || c.name?.tr || c.name?.en || c.id;

/* Тема */
let theme = localStorage.getItem("theme") || (tg?.colorScheme) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme(){ document.documentElement.dataset.theme = theme; $("themeBtn").textContent = theme==="dark" ? "☀️" : "🌙"; }
$("themeBtn").onclick = () => { theme = theme==="dark"?"light":"dark"; localStorage.setItem("theme",theme); applyTheme(); };

/* Язык */
function renderLangSwitch(){
  $("langSwitch").innerHTML = ["ru","uz","tr"].map(l =>
    `<button class="${l===lang?'active':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
}
function setLang(l){ lang=l; localStorage.setItem("lang",l); renderAll(); }
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("searchInput").placeholder = t("search");
}

/* Навигация */
function go(page){
  curPage = page;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  $("page-"+page).classList.add("active");
  document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.toggle("active", b.dataset.page===page));
  if (page==="cart") renderCart();
  if (page==="fav") renderFavs();
  if (page==="orders") renderOrders();
  if (page==="checkout") renderCheckoutSummary();
  if (page==="admin") renderAdmin();
  renderCartBar();
  window.scrollTo(0,0);
}
document.querySelectorAll(".bottom-nav button").forEach(b => b.onclick = () => go(b.dataset.page));

/* Вход в админку: 5 быстрых нажатий на логотип или адрес сайта + #admin */
let logoTaps=0, logoTimer;
$("logoBtn").onclick = () => {
  logoTaps++; clearTimeout(logoTimer); logoTimer=setTimeout(()=>logoTaps=0,1500);
  if (logoTaps>=5){ logoTaps=0; go("admin"); }
};

/* Каталог */
function renderChips(){
  $("chips").innerHTML =
    `<button class="chip ${currentCat==="all"?'active':''}" onclick="setCat('all')">${t("all")}</button>` +
    CATS.map(c =>
      `<button class="chip ${c.id===currentCat?'active':''}" onclick="setCat('${esc(c.id)}')">${esc(catName(c))}</button>`).join("");
}
function setCat(c){ currentCat=c; renderChips(); renderGrid(); }
$("searchInput").oninput = e => { search = e.target.value.toLowerCase(); renderGrid(); };

function productCard(p){
  const inCart = cart[p.id] || 0;
  const img = p.img ? `<img class="photo" src="${esc(p.img)}" alt="" loading="lazy">` : `<div class="emoji">${p.emoji||"📦"}</div>`;
  return `<div class="card" onclick="openModal(${p.id})">
    <button class="fav-btn ${favs.includes(p.id)?'on':''}" onclick="event.stopPropagation();toggleFav(${p.id})">💚</button>
    ${p.stock===false?`<span class="badge-out">${t("outStock")}</span>`:""}
    ${img}
    <div class="name">${esc(pname(p))}</div>
    <div class="desc">${esc(pdesc(p))}</div>
    <div class="price">${fmt(p.price)} <small>/ ${punit(p)}</small></div>
    <div onclick="event.stopPropagation()">
      ${p.stock===false ? `<button class="btn btn-soft" disabled>${t("outStock")}</button>` :
        inCart ? stepperHtml(p.id, inCart) :
        `<button class="btn btn-soft" onclick="addToCart(${p.id})">＋ ${t("add")}</button>`}
    </div>
  </div>`;
}
function stepperHtml(id, qty){
  return `<div class="stepper">
    <button onclick="changeQty(${id},-1)">−</button><span>${qty}</span><button onclick="changeQty(${id},1)">＋</button>
  </div>`;
}
function renderGrid(){
  const list = PRODUCTS.filter(p =>
    (currentCat==="all" || p.cat===currentCat) &&
    (!search || (pname(p)+" "+pdesc(p)).toLowerCase().includes(search)));
  $("productGrid").innerHTML = list.map(productCard).join("") ||
    `<div class="empty" style="grid-column:1/-1"><div class="big">🔎</div></div>`;
}

/* Избранное */
function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : [...favs,id];
  localStorage.setItem("favs", JSON.stringify(favs));
  renderGrid(); if(curPage==="fav") renderFavs();
}
function renderFavs(){
  const list = PRODUCTS.filter(p => favs.includes(p.id));
  $("favGrid").innerHTML = list.map(productCard).join("");
  $("favEmpty").style.display = list.length ? "none" : "block";
}

/* Корзина */
function addToCart(id){ cart[id]=(cart[id]||0)+1; saveCart(); toast(t("added")); }
function changeQty(id,d){
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  saveCart();
}
function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  renderGrid(); renderCartBar();
  if(curPage==="cart") renderCart();
  if(curPage==="fav") renderFavs();
  if(curPage==="checkout") renderCheckoutSummary();
  if(modalProductId!==null && $("modalBg").classList.contains("open")) openModal(modalProductId);
}
function cartItems(){ return Object.entries(cart).map(([id,qty]) => ({p:PRODUCTS.find(x=>x.id==id), qty})).filter(x=>x.p); }
function cartTotal(){ return cartItems().reduce((s,{p,qty}) => s+p.price*qty, 0); }
function renderCartBar(){
  const items = cartItems(), n = items.reduce((s,x)=>s+x.qty,0);
  $("cartBar").style.display = (n && curPage!=="checkout" && curPage!=="cart" && curPage!=="admin" && curPage!=="success") ? "block" : "none";
  $("cartBarCount").textContent = n + " " + t("items");
  $("cartBarSum").textContent = fmt(cartTotal());
}
function renderCart(){
  const items = cartItems();
  $("cartEmpty").style.display = items.length ? "none" : "block";
  $("cartSummary").style.display = items.length ? "block" : "none";
  $("cartList").innerHTML = items.map(({p,qty}) => `
    <div class="list-card row">
      <div class="thumb">${p.img?`<img src="${esc(p.img)}">`:(p.emoji||"📦")}</div>
      <div class="grow">
        <div style="font-weight:700;font-size:14px">${esc(pname(p))}</div>
        <div class="muted">${fmt(p.price)} / ${punit(p)}</div>
        <div style="font-weight:800;margin-top:2px">${fmt(p.price*qty)}</div>
      </div>
      <div style="width:118px">${stepperHtml(p.id, qty)}</div>
    </div>`).join("");
  $("cartTotal").textContent = fmt(cartTotal() + (deliveryMode==="delivery"?CONFIG.deliveryFee:0));
}

/* Оформление */
document.querySelectorAll("#segDelivery button").forEach(b => b.onclick = () => {
  deliveryMode = b.dataset.val;
  document.querySelectorAll("#segDelivery button").forEach(x=>x.classList.toggle("active",x===b));
  $("addressField").style.display = deliveryMode==="delivery" ? "block" : "none";
  renderCheckoutSummary();
});
function renderManagers(){
  const seg = $("segManager");
  if (seg) {
    seg.innerHTML = CONFIG.managers.map((m,i) =>
      `<button class="${i===managerIdx?'active':''}" onclick="managerIdx=${i};renderManagers()">${m.icon} ${t(m.key)}</button>`).join("");
  }
  const box = $("promoContacts");
  if (box) {
    box.innerHTML = CONFIG.managers.map(m =>
      `<a href="https://t.me/${esc(m.username)}" target="_blank" rel="noopener">${m.icon} ${t(m.key)}</a>`).join("") +
      (CONFIG.phone ? `<a href="tel:${esc(CONFIG.phone)}">📞 ${esc(CONFIG.phone)}</a>` : "");
  }
}

function renderCheckoutSummary(){
  const items = cartItems();
  const fee = deliveryMode==="delivery" ? CONFIG.deliveryFee : 0;
  $("checkoutSummary").innerHTML =
    items.map(({p,qty}) => `<div class="total-line"><span>${esc(pname(p))} × ${qty}</span><span>${fmt(p.price*qty)}</span></div>`).join("") +
    (deliveryMode==="delivery" ? `<div class="total-line"><span>${t("deliveryFeeLbl")}</span><span>${fee?fmt(fee):t("free")}</span></div>` : "") +
    `<div class="total-line big"><span>${t("total")}</span><span>${fmt(cartTotal()+fee)}</span></div>`;
}

/* Текст заказа, который уходит менеджеру в Telegram */
function orderText(order, invoice){
  const L = [];
  L.push(`🛍 ${t("orderTitle")} №${invoice}`);
  L.push("");
  order.items.forEach(i => L.push(`• ${i.name} — ${i.qty} × ${fmt(i.price)} = ${fmt(i.sum)}`));
  L.push("");
  if (order.deliveryFee > 0) L.push(`${t("deliveryFeeLbl")}: ${fmt(order.deliveryFee)}`);
  L.push(`💰 ${t("total")}: ${fmt(order.total)}`);
  L.push(t("payCash"));
  L.push("");
  L.push(`👤 ${order.name}`);
  L.push(`📞 ${order.phone}`);
  L.push(order.deliveryMode === "delivery" ? t("delivery") : t("pickup"));
  if (order.address && order.address !== "-") L.push(`📍 ${order.address}`);
  if (order.comment) L.push(`💬 ${order.comment}`);
  return L.join("\n");
}

async function placeOrder(){
  const name = $("fName").value.trim(), phone = $("fPhone").value.trim();
  const address = deliveryMode==="delivery" ? $("fAddress").value.trim() : "-";
  const items = cartItems();
  if (!items.length) { go("home"); return; }
  if (!name || !phone || (deliveryMode==="delivery" && !$("fAddress").value.trim())) { toast(t("fillFields")); return; }
  if (CONFIG.minOrder && cartTotal() < CONFIG.minOrder) { toast(t("minOrderMsg") + fmt(CONFIG.minOrder)); return; }

  const fee = deliveryMode==="delivery" ? CONFIG.deliveryFee : 0;
  const order = {
    name, phone, address, comment: $("fComment").value.trim(),
    deliveryMode, payMode, lang,
    items: items.map(({p,qty}) => ({id:p.id, name:pname(p), price:p.price, unit:punit(p), qty, sum:p.price*qty})),
    total: cartTotal()+fee, deliveryFee: fee,
  };

  const invoice =
    new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" +
    Math.floor(1000 + Math.random()*9000);

  const manager = CONFIG.managers[managerIdx] || CONFIG.managers[0];
  const link = `https://t.me/${manager.username}?text=${encodeURIComponent(orderText(order, invoice))}`;

  finishOrder(order, invoice);
  toast(t("orderReady"));

  // открываем чат с менеджером — покупателю остаётся нажать «Отправить»
  if (tg?.openTelegramLink) { try { tg.openTelegramLink(link); return; } catch(e){} }
  window.open(link, "_blank");
}
function finishOrder(order, invoice){
  let history = []; try { history = JSON.parse(localStorage.getItem("orders") || "[]"); } catch(e){}
  history.unshift({...order, invoice, date: new Date().toISOString()});
  localStorage.setItem("orders", JSON.stringify(history.slice(0,50)));
  cart = {}; saveCart();
  $("successInfo").textContent = t("successInfo").replace("{n}", invoice);
  go("success");
  if (tg?.HapticFeedback) try { tg.HapticFeedback.notificationOccurred("success"); } catch(e){}
}

/* Мои заказы */
function renderOrders(){

/* Toast */
let toastTimer;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

  ensureDrafts();

/* --- ФОТО: загрузка с телефона, сжатие в компактный формат --- */
function adminPickPhoto(i){
  ensureDrafts();
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const max = 600;
        const scale = Math.min(1, max/Math.max(img.width,img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        adminDraft[i].img = cv.toDataURL("image/jpeg", 0.72);
        renderAdmin(); toast(t("photoAdded"));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

/* --- сохранение в GitHub --- */
const gh = (path) =>
  `https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}/contents/${path}`;
const ghHeaders = () => ({
  Authorization: "Bearer " + adminToken,
  Accept: "application/vnd.github+json",
  "Content-Type": "application/json",
});

/* свежий номер версии файла (без кэша) */
async function ghSha(path){
  try {
    const res = await fetch(gh(path) + "?ref=" + CONFIG.github.branch + "&_=" + Date.now(), {
      headers: { ...ghHeaders(), "Cache-Control": "no-cache", "If-None-Match": "" },
      cache: "no-store",
    });
    if (res.ok) return (await res.json()).sha;
  } catch(e){}
  return undefined;
}

/* запись файла с повтором, если версия устарела (409) */
async function ghPut(path, contentBase64, message){
  let lastErr = "";
  for (let attempt = 1; attempt <= 4; attempt++) {
    const sha = await ghSha(path);
    const res = await fetch(gh(path), {
      method: "PUT",
      headers: ghHeaders(),
      body: JSON.stringify({ message, content: contentBase64, branch: CONFIG.github.branch, ...(sha ? {sha} : {}) })
    });
    if (res.ok) return res.json();

    let detail = "";
    try { detail = (await res.json()).message || ""; } catch(e){}
    lastErr = `${res.status} ${detail}`;

    // 409/422 — файл успели изменить: подождём и возьмём свежую версию
    if (res.status === 409 || res.status === 422) {
      await new Promise(r => setTimeout(r, 900 * attempt));
      continue;
    }
    throw new Error(lastErr);
  }
  throw new Error(lastErr);
}

/* utf-8 текст -> base64 (по кускам, чтобы не падало на больших каталогах) */
function toBase64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}

async function adminSave(){
  ensureDrafts();
  const btn = $("adminSaveBtn");
  if (btn) { btn.disabled = true; btn.textContent = t("saving"); }
  try {
    if (!adminToken) throw new Error("Ключ доступа не введён");
    // 1. фото, снятые на телефон, сохраняем отдельными файлами
    for (const p of adminDraft) {
      const m = typeof p.img === "string" && p.img.match(/^data:image\/(jpeg|jpg|png|webp);base64,(.+)$/);
      if (!m) continue;
      const ext = m[1] === "jpeg" ? "jpg" : m[1];
      const name = `${CONFIG.github.photos}/p${p.id}-${Date.now()}.${ext}`;
      await ghPut(name, m[2], "photo: " + name);
      p.img = name;
    }
    // 2. сам каталог
    const catalog = JSON.stringify({ products: adminDraft, categories: adminCatDraft }, null, 2);
    await ghPut(CONFIG.github.catalog, toBase64(catalog), "catalog update");

    PRODUCTS = JSON.parse(JSON.stringify(adminDraft));
    CATS = JSON.parse(JSON.stringify(adminCatDraft));
    if (currentCat!=="all" && !CATS.some(c=>c.id===currentCat)) currentCat="all";
    toast(t("savedGh")); renderAll();
  } catch(e){
    console.error(e);
    let msg = String(e && e.message || e);
    if (msg.includes("Bad credentials") || msg.includes("401")) msg = "Ключ неверный или устарел";
    else if (msg.includes("Resource not accessible") || msg.includes("403")) msg = "У ключа нет прав на запись (Contents: Read and write)";
    else if (msg.includes("Not Found") || msg.includes("404")) msg = "Репозиторий не найден — проверьте доступ ключа к E-BAZAR";
    else if (msg.includes("409") || msg.includes("does not match")) msg = "Каталог изменился в другом окне. Обновите страницу и повторите";
    else if (msg.length > 90) msg = t("saveFail");
    toast("⚠️ " + msg);
    const needNewKey = /401|403|404|прав|неверн|устарел|не найден/i.test(msg);
    alert("Не удалось сохранить:\n\n" + msg + (needNewKey ? "\n\n" + t("askNewKey") : ""));
    if (needNewKey && confirm(t("askNewKey"))) adminLogout();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = t("saveAll"); }
  }
}

async function loadProducts(){
  try {
    const res = await fetch("catalog.json?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) return;
    const data = await res.json();
    // новый формат {products, categories} и старый (просто массив товаров)
    const prods = Array.isArray(data) ? data : data.products;
    const cats  = Array.isArray(data) ? null : data.categories;
    if (Array.isArray(prods) && prods.length) { PRODUCTS = prods; adminDraft = null; }
    if (Array.isArray(cats) && cats.length)   { CATS = cats; adminCatDraft = null; }
    if (currentCat!=="all" && !CATS.some(c=>c.id===currentCat)) currentCat="all";
    renderAll();
  } catch(e){ /* работаем на встроенных товарах */ }
}
